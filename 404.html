<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    // GitHub Pages Single Page App Redirect
    (function () {
      var path = window.location.pathname;
      var repo = "/amaxskywithsunshine.github.io";
      if (path.indexOf(repo) === 0) {
        path = path.slice(repo.length);
      }
      var clean = path.replace(/^\/+|\/+$/g, "");
      var query = window.location.search;
      var hash = window.location.hash;
      window.location.replace("./?route=" + encodeURIComponent(clean) + (query ? "&" + query.slice(1) : "") + hash);
    })();
  </script>
</head>
<body>
  <p>Redirecting to destination...</p>
</body>
</html>
